<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Basket | Tiki Industries</title>
<style>
:root{--black:#111;--gray:#777;--light:#eee}*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;min-height:100vh;display:flex;flex-direction:column;font-family:Arial,sans-serif;color:var(--black);line-height:1.5;background:#fff}a{text-decoration:none;color:inherit}header{display:flex;justify-content:space-between;align-items:center;padding:20px 6%;background:#fff;border-bottom:1px solid var(--light)}.logo{font-weight:bold;letter-spacing:2px;text-transform:uppercase}.logo span{display:inline-block;padding:6px 10px;border:1px solid var(--black);margin-right:10px;font-size:.72rem}nav{display:flex;gap:22px;align-items:center}nav a{font-size:.9rem}.nav-basket{display:inline-flex;align-items:center;gap:8px}.basket-count{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 6px;border-radius:50%;background:var(--black);color:#fff;font-size:.7rem}.page{flex:1;width:100%;padding:60px 6% 90px}.heading{margin-bottom:30px}.heading h1{margin:0;font-size:2.8rem}.basket-items{max-width:800px}.item{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid var(--light)}.item strong{display:block}.item small{display:block;color:var(--gray)}.remove{background:transparent;border:0;padding:0;color:var(--gray);text-decoration:underline;cursor:pointer}.total{display:flex;justify-content:space-between;max-width:800px;padding-top:22px;font-weight:bold}.empty{color:var(--gray);padding:18px 0}.buy-now{margin-top:24px;padding:14px 28px;border:1px solid var(--black);background:var(--black);color:#fff;cursor:pointer;text-transform:uppercase}.buy-now:disabled{opacity:.4;cursor:not-allowed}footer{padding:30px 6%;background:var(--black);color:#999;text-align:center;font-size:.8rem}@media(max-width:700px){header{padding:17px 5%}nav{gap:12px}nav a{font-size:.75rem}}
</style>
</head>
<body>
<header><a class="logo" href="index.html"><span>T</span>Tiki Industries</a><nav><a href="shop.html">Shop</a><a href="index.html#info">Info</a><a href="basket.html" class="nav-basket">Basket <span class="basket-count" id="basket-count">0</span></a></nav></header>
<main class="page"><div class="heading"><h1>Your Basket</h1></div><div id="basket-items" class="basket-items"></div><div class="total"><span>Total</span><span id="basket-total">£0</span></div><button class="buy-now" id="buy-now" onclick="buyNow()">Buy now</button></main>
<footer>© 2026 Tiki Industries. All rights reserved.</footer>
<script>
let basket=JSON.parse(localStorage.getItem('tikiBasket')||'[]');
function save(){localStorage.setItem('tikiBasket',JSON.stringify(basket))}
function render(){document.getElementById('basket-count').textContent=basket.length;const box=document.getElementById('basket-items'),total=document.getElementById('basket-total'),buy=document.getElementById('buy-now');buy.disabled=!basket.length;if(!basket.length){box.innerHTML='<p class="empty">Your basket is currently empty.</p>';total.textContent='£0';return}let sum=0;box.innerHTML=basket.map((item,i)=>{sum+=Number(item.price)||0;return `<div class="item"><div><strong>${item.name}</strong><small>Size: ${item.size} — £${item.price}</small></div><button class="remove" onclick="removeItem(${i})">Remove</button></div>`}).join('');total.textContent=`£${sum}`}
function removeItem(i){basket.splice(i,1);save();render()}
function buyNow(){if(!basket.length)return;alert('Thanks! Checkout is ready to be connected.')}
render();
</script>
</body>
</html>
