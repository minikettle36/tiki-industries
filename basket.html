<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Basket | Tiki Industries</title><style>:root{--black:#111;--gray:#777;--light:#eee}*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;min-height:100vh;display:flex;flex-direction:column;font-family:Arial,sans-serif;color:var(--black)}a{text-decoration:none;color:inherit}header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:20px 6%;background:#fffffff2;border-bottom:1px solid var(--light);backdrop-filter:blur(8px)}.logo{display:inline-flex;align-items:center}.logo img{display:block;width:150px;height:42px;object-fit:contain;object-position:left center}nav{display:flex;gap:22px;align-items:center}nav a{font-size:.9rem}.nav-basket{display:inline-flex;align-items:center;gap:8px}.basket-count{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 6px;border-radius:50%;background:var(--black);color:#fff;font-size:.7rem}.page{width:min(900px,88%);margin:0 auto;padding:60px 0;flex:1}.heading h1{font-size:2.8rem}.basket-items{display:grid;gap:12px}.item{display:flex;justify-content:space-between;align-items:center;padding:18px;border:1px solid var(--light)}.item small{color:var(--gray)}.remove{border:1px solid var(--black);background:#fff;padding:8px 12px}.total{display:flex;justify-content:space-between;border-top:1px solid var(--black);margin-top:28px;padding-top:18px;font-size:1.2rem}.buy{margin-top:25px;padding:14px 22px;background:var(--black);color:#fff;border:0}.empty{color:var(--gray)}footer{padding:30px 6%;background:var(--black);color:#999;text-align:center;font-size:.8rem}@media(max-width:700px){header{padding:17px 5%}.logo img{width:125px;height:36px}nav{gap:12px}nav a{font-size:.75rem}.item{gap:15px}}</style></head><body><header><a class="logo" href="index.html" aria-label="Tiki Industries home"><img src="HLAG9608.JPG" alt="Tiki Industries logo"></a><nav><a href="shop.html">Shop</a><a href="info.html">Info</a><a href="basket.html" class="nav-basket">Basket <span class="basket-count" id="basket-count">0</span></a></nav></header><main class="page"><div class="heading"><h1>Your Basket</h1></div><div id="basket-items" class="basket-items"></div><div class="total"><span>Total</span><span id="basket-total">£0</span></div><button class="buy" id="buy-button" onclick="buyNow()">Checkout</button></main><footer>© 2026 Tiki Industries. All rights reserved.</footer><script>let basket=JSON.parse(localStorage.getItem('tikiBasket')||'[]');function save(){localStorage.setItem('tikiBasket',JSON.stringify(basket))}function render(){document.getElementById('basket-count').textContent=basket.length;const box=document.getElementById('basket-items'),total=document.getElementById('basket-total'),buy=document.getElementById('buy-button');box.innerHTML='';let sum=0;if(!basket.length){box.innerHTML='<p class="empty">Your basket is empty.</p>';buy.disabled=true}else{basket.forEach((item,i)=>{sum+=Number(item.price)||0;box.innerHTML+=`<div class="item"><div><strong>${item.name}</strong><br><small>Size: ${item.size} · £${item.price}</small></div><button class="remove" onclick="removeItem(${i})">Remove</button></div>`});buy.disabled=false}total.textContent='£'+sum}function removeItem(i){basket.splice(i,1);save();render()}function buyNow(){if(!basket.length)return;alert('Thanks! Checkout is ready to be connected.')}render();</script></body></html>
