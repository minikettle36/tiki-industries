<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Basket | Tiki Industries</title>
<style>
:root{--black:#111;--gray:#777;--light:#eee;--white:#fff}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--black);line-height:1.5;background:#fff}a{text-decoration:none;color:inherit}header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:20px 6%;background:#fffffff2;border-bottom:1px solid var(--light);backdrop-filter:blur(8px)}.logo{font-weight:bold;letter-spacing:2px;text-transform:uppercase}.logo span{display:inline-block;padding:6px 10px;border:1px solid var(--black);margin-right:10px;font-size:.72rem}nav{display:flex;gap:22px;align-items:center}nav a{font-size:.9rem}.nav-basket{display:inline-flex;align-items:center;gap:8px}.basket-count{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 6px;border-radius:50%;background:var(--black);color:#fff;font-size:.7rem}.page{padding:60px 6% 90px}.heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:30px}.heading h1{margin:0;font-size:2.8rem;letter-spacing:-1px}.heading p{max-width:500px;color:var(--gray)}.basket-items{max-width:800px}.item{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid var(--light)}.item strong{display:block}.item small{display:block;color:var(--gray)}.remove{background:transparent;border:0;padding:0;color:var(--gray);text-decoration:underline;cursor:pointer}.total{display:flex;justify-content:space-between;max-width:800px;padding-top:22px;font-weight:bold}.empty{color:var(--gray);padding:18px 0}footer{padding:30px 6%;background:var(--black);color:#999;text-align:center;font-size:.8rem}@media(max-width:700px){header{padding:17px 5%}nav{gap:12px}nav a{font-size:.75rem}.heading{display:block}.heading p{margin-top:12px}}
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html"><span>T</span>Tiki Industries</a>
  <nav>
    <a href="shop.html">Shop</a>
    <a href="index.html#info">Info</a>
    <a href="basket.html" class="nav-basket">Basket <span class="basket-count" id="basket-count">0</span></a>
  </nav>
</header>

<div class="page">
  <div class="heading">
    <h1>Your Basket</h1>
    <p>Your selected items are saved in this browser.</p>
  </div>

  <div id="basket-items" class="basket-items"></div>

  <div class="total">
    <span>Total</span>
    <span id="basket-total">$0</span>
  </div>
</div>

<footer>© 2026 Tiki Industries. All rights reserved.</footer>

<script>
let basket = JSON.parse(localStorage.getItem('tikiBasket') || '[]');

function saveBasket() {
  localStorage.setItem('tikiBasket', JSON.stringify(basket));
}

function updateBasketBadge() {
  document.getElementById('basket-count').textContent = basket.length;
}

function renderBasket() {
  const box = document.getElementById('basket-items');
  const total = document.getElementById('basket-total');
  updateBasketBadge();

  if (!basket.length) {
    box.innerHTML = '<p class="empty">Your basket is currently empty.</p>';
    total.textContent = '$0';
    return;
  }

  let sum = 0;
  box.innerHTML = basket.map((item, i) => {
    sum += item.price;
    return `
      <div class="item">
        <div>
          <strong>${item.name}</strong>
          <small>Size: ${item.size} — $${item.price}</small>
        </div>
        <button class="remove" onclick="removeItem(${i})">Remove</button>
      </div>
    `;
  }).join('');

  total.textContent = `$${sum}`;
}

function removeItem(index) {
  basket.splice(index, 1);
  saveBasket();
  renderBasket();
}

renderBasket();
</script>
</body>
</html>
