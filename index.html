<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tiki Industries | MTB Clothing</title>
<style>
:root{--black:#111;--gray:#777;--light:#eee}*{box-sizing:border-box;scroll-behavior:smooth}body{margin:0;font-family:Arial,sans-serif;color:var(--black);line-height:1.5;background:#fff}a{text-decoration:none;color:inherit}header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:20px 6%;background:#fffffff2;border-bottom:1px solid var(--light);backdrop-filter:blur(8px)}.logo{font-weight:bold;letter-spacing:2px;text-transform:uppercase}.logo span{display:inline-block;padding:6px 10px;border:1px solid var(--black);margin-right:10px;font-size:.72rem}nav{display:flex;gap:22px;align-items:center}nav a{font-size:.9rem}.nav-basket{display:inline-flex;align-items:center;gap:8px}.basket-count{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 6px;border-radius:50%;background:var(--black);color:#fff;font-size:.7rem}.hero{min-height:65vh;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:50px;padding:70px 6%;background:#fff}.hero h1{margin:0 0 18px;font-size:clamp(3.4rem,8vw,7rem);line-height:.9;text-transform:uppercase}.hero p{max-width:520px;color:var(--gray)}.button{display:inline-block;margin-top:15px;padding:14px 22px;background:var(--black);color:#fff;text-transform:uppercase;font-size:.85rem}.hero-image{height:min(560px,65vh);background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}.hero-image img{width:100%;height:100%;object-fit:contain;transition:opacity .45s ease}.featured{padding:70px 6% 90px}.featured h2{margin:0 0 30px;font-size:2rem}.feature-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:25px}.feature-card{border:1px solid var(--black);background:#fff}.feature-photo{height:330px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid var(--black)}.feature-photo img{width:100%;height:100%;object-fit:contain}.feature-card div:last-child{padding:18px}.feature-card h3{margin:0 0 4px}.feature-card p{margin:0;color:var(--gray)}footer{padding:30px 6%;background:var(--black);color:#999;text-align:center;font-size:.8rem}@media(max-width:700px){header{padding:17px 5%}nav{gap:12px}nav a{font-size:.75rem}.hero{grid-template-columns:1fr;padding:45px 5%}.hero-image{height:360px}.featured{padding:55px 5% 70px}.feature-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><a class="logo" href="index.html"><span>T</span>Tiki Industries</a><nav><a href="shop.html">Shop</a><a href="info.html">Info</a><a href="basket.html" class="nav-basket">Basket <span class="basket-count" id="basket-count">0</span></a></nav></header>
<main><section class="hero"><div><h1>Ride<br>Different.</h1><p>MTB clothing built for the trails, the streets, and everything between. Simple designs. Bold graphics. No unnecessary noise.</p><a class="button" href="shop.html">Shop now</a></div><div class="hero-image"><img id="hero-image" src="babybluehoodiefront.JPG" alt="Baby Blue OG Hoodie"></div></section><section class="featured"><h2>Featured products</h2><div class="feature-grid" id="featured-products"></div></section></main>
<footer>© 2026 Tiki Industries. All rights reserved.</footer>
<script>
const products=[{name:'OG Hoodie',description:'The original Tiki Industries hoodie.',image:'babybluehoodiefront.JPG',alt:'Baby Blue OG Hoodie'},{name:'The Nuclear Hoodie',description:'A black hoodie with the bold Nuclear graphic.',image:'image-2-black-hoodie-front.png.JPG',alt:'The Nuclear Hoodie'},{name:'OG T-Shirt',description:'The original Tiki Industries graphic T-shirt.',image:'white%20shirt%20front.JPG',alt:'White OG T-Shirt'}];
const heroImages=[
  {src:'babybluehoodiefront.JPG',alt:'Baby Blue OG Hoodie'},
  {src:'brownhoodiefront.JPG',alt:'Brown OG Hoodie'},
  {src:'grayhoodiefront.JPG',alt:'Gray OG Hoodie'},
  {src:'khakigrayhoodiefront.JPG',alt:'Khaki Gray OG Hoodie'},
  {src:'lightsunscreenhoodiefront.JPG',alt:'Light Sunscreen OG Hoodie'},
  {src:'image-2-black-hoodie-front.png.JPG',alt:'The Nuclear Hoodie'},
  {src:'blueshirtfront.JPG',alt:'Blue OG T-Shirt'},
  {src:'brownshirtfront.JPG',alt:'Brown OG T-Shirt'},
  {src:'grayshirtfront.JPG',alt:'Gray OG T-Shirt'},
  {src:'pinkshirtfront.JPG',alt:'Pink OG T-Shirt'},
  {src:'white%20shirt%20front.JPG',alt:'White OG T-Shirt'}
];
const basket=JSON.parse(localStorage.getItem('tikiBasket')||'[]');document.getElementById('basket-count').textContent=basket.length;document.getElementById('featured-products').innerHTML=products.map(p=>`<a class="feature-card" href="shop.html"><div class="feature-photo"><img src="${p.image}" alt="${p.alt}"></div><div><h3>${p.name}</h3><p>${p.description}</p></div></a>`).join('');
let heroIndex=0;const heroImage=document.getElementById('hero-image');setInterval(()=>{heroImage.style.opacity='0';setTimeout(()=>{heroIndex=(heroIndex+1)%heroImages.length;heroImage.src=heroImages[heroIndex].src;heroImage.alt=heroImages[heroIndex].alt;heroImage.style.opacity='1'},450)},3500);
</script>
</body>
</html>
