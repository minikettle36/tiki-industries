<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tiki Industries To-Do List</title>
<style>
:root{--black:#111;--gray:#777;--light:#eee;--white:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--black);font-family:Arial,sans-serif;color:var(--black)}.app{width:min(100%,680px);padding:32px;background:white;box-shadow:0 18px 60px #0005}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:28px}.brand{margin:0 0 6px;color:var(--gray);font-size:.75rem;letter-spacing:2px;text-transform:uppercase}h1{margin:0;font-size:clamp(2rem,7vw,3.5rem);letter-spacing:-2px}.count{color:var(--gray);font-size:.9rem}.form{display:flex;gap:10px;margin-bottom:20px}input[type=text]{min-width:0;flex:1;padding:14px;border:1px solid #ccc;font:inherit}button{padding:12px 16px;border:1px solid var(--black);background:var(--black);color:white;cursor:pointer;font:inherit}button:hover{background:white;color:var(--black)}.filters{display:flex;gap:8px;border-bottom:1px solid var(--light);padding-bottom:14px;margin-bottom:18px}.filter{padding:7px 10px;border-color:transparent;background:transparent;color:var(--gray);font-size:.85rem}.filter.active{border-color:var(--black);background:var(--black);color:white}ul{display:grid;gap:10px;list-style:none;margin:0;padding:0}.task{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--light)}.task input{width:18px;height:18px;accent-color:var(--black)}.text{min-width:0;flex:1;overflow-wrap:anywhere}.done .text{color:var(--gray);text-decoration:line-through}.actions{display:flex;gap:6px}.actions button,.secondary{padding:7px 10px;background:white;color:var(--black);font-size:.8rem}.empty{padding:28px 0;color:var(--gray);text-align:center}.footer{display:flex;justify-content:space-between;margin-top:24px}.secondary:hover{background:var(--light)}@media(max-width:520px){.app{padding:24px 18px}header{display:block}.count{display:block;margin-top:10px}.form{flex-direction:column}.form button{width:100%}.task{align-items:flex-start}.actions{flex-direction:column}}
</style>
</head>
<body>
<main class="app">
<header><div><p class="brand">Tiki Industries</p><h1>To-do list</h1></div><span class="count" id="count">0 tasks left</span></header>
<form class="form" id="form"><input id="input" type="text" placeholder="What needs doing?" maxlength="120" autocomplete="off" required><button>Add task</button></form>
<div class="filters"><button class="filter active" data-filter="all" type="button">All</button><button class="filter" data-filter="active" type="button">Active</button><button class="filter" data-filter="completed" type="button">Completed</button></div>
<ul id="list"></ul>
<div class="footer"><button class="secondary" id="clearCompleted" type="button">Clear completed</button><button class="secondary" id="clearAll" type="button">Clear all</button></div>
</main>
<script>
const KEY='tikiTodoTasks';let tasks=JSON.parse(localStorage.getItem(KEY)||'[]'),filter='all';const $=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(tasks))}function shown(){return filter==='active'?tasks.filter(t=>!t.done):filter==='completed'?tasks.filter(t=>t.done):tasks}function render(){let left=tasks.filter(t=>!t.done).length;$('count').textContent=`${left} ${left===1?'task':'tasks'} left`;let list=$('list');list.replaceChildren();let items=shown();if(!items.length){let e=document.createElement('li');e.className='empty';e.textContent=filter==='all'?'No tasks yet.':'No tasks in this view.';list.append(e);return}items.forEach(t=>{let li=document.createElement('li');li.className='task'+(t.done?' done':'');let cb=document.createElement('input');cb.type='checkbox';cb.checked=t.done;cb.addEventListener('change',()=>{t.done=cb.checked;save();render()});let text=document.createElement('span');text.className='text';text.textContent=t.text;let actions=document.createElement('div');actions.className='actions';let edit=document.createElement('button');edit.type='button';edit.textContent='Edit';edit.onclick=()=>{let value=prompt('Edit task:',t.text);if(value&&value.trim()){t.text=value.trim();save();render()}};let del=document.createElement('button');del.type='button';del.textContent='Delete';del.onclick=()=>{tasks=tasks.filter(x=>x.id!==t.id);save();render()};actions.append(edit,del);li.append(cb,text,actions);list.append(li)})}$('form').addEventListener('submit',e=>{e.preventDefault();let text=$('input').value.trim();if(!text)return;tasks.unshift({id:Date.now()+Math.random(),text,done:false});$('input').value='';save();render();$('input').focus()});document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});$('clearCompleted').onclick=()=>{tasks=tasks.filter(t=>!t.done);save();render()};$('clearAll').onclick=()=>{if(tasks.length&&confirm('Delete all tasks?')){tasks=[];save();render()}};render();
</script>
</body>
</html>
