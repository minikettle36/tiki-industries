<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Info | Tiki Industries</title>
<style>
  :root{--black:#111;--gray:#777;--light:#eee}
  *{box-sizing:border-box}
  
  /* Make page take full height and layout vertically */
  html{height:100%}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;font-family:Arial,sans-serif;color:var(--black);line-height:1.5}
  
  a{text-decoration:none;color:inherit}
  header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:20px 6%;background:#fffffff2;border-bottom:1px solid var(--light);backdrop-filter:blur(8px)}
  .logo{display:inline-flex;align-items:center}
  .logo img{display:block;width:150px;height:42px;object-fit:contain;object-position:left center}
  nav{display:flex;gap:22px;align-items:center}
  nav a{font-size:.9rem}
  .nav-basket{display:inline-flex;align-items:center;gap:8px}
  .basket-count{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 6px;border-radius:50%;background:var(--black);color:#fff;font-size:.7rem}
  
  /* Main content area expands to push footer down */
  .page{padding:80px 6%;max-width:900px;width:100%;flex:1}
  .intro h1{font-size:3rem;margin-top:0}
  .intro p{color:var(--gray);max-width:650px}
  
  /* Footer stays at the bottom */
  footer{padding:30px 6%;background:var(--black);color:#999;text-align:center;font-size:.8rem;margin-top:auto}
  
  @media(max-width:700px){
    header{padding:17px 5%}
    .logo img{width:125px;height:36px}
    nav{gap:12px}
    nav a{font-size:.75rem}
