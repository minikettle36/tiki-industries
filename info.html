<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiki Industries - Built for the ride.</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
    </style>
</head>
<body class="bg-white text-gray-900 min-h-screen flex flex-col justify-between antialiased selection:bg-gray-200">

    <main class="flex-grow flex items-center px-8 sm:px-16 md:px-24 lg:px-32 py-16">
        <div class="max-w-xl">
            <!-- Main Heading -->
            <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight text-black mb-6">
                Built for the ride.
            </h1>
            
            <!-- Description Paragraph -->
            <p class="text-gray-500 text-sm sm:text-base leading-relaxed font-normal">
                Tiki Industries makes MTB clothing for riders who want comfortable everyday pieces with bold, uncomplicated graphics. Wear it on the trails, the streets, and everywhere between.
            </p>
        </div>
    </main>

    <footer class="w-full bg-[#111111] py-8 px-4 text-center">
        <p class="text-xs sm:text-sm text-gray-400 font-normal">
            &copy; 2026 Tiki Industries. All rights reserved.
        </p>
    </footer>

</body>
</html>
