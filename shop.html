<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop | Tiki Industries</title>
<style>
:root{--black:#111;--gray:#777;--light:#eee}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--black);line-height:1.5;background:#fff}a{text-decoration:none;color:inherit}header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:20px 6%;background:#fffffff2;border-bottom:1px solid var(--light);backdrop-filter:blur(8px)}.logo{display:inline-flex;align-items:center}.logo img{display:block;width:150px;height:42px;object-fit:contain;object-position:left center}nav{display:flex;gap:22px;align-items:center}nav a{font-size:.9rem}.nav-basket{display:inline-flex;align-items:center;gap:8px}.basket-count{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 6px;border-radius:50%;background:var(--black);color:#fff;font-size:.7rem}.page{padding:60px 6% 90px}.heading{margin-bottom:35px}.heading h1{margin:0;font-size:2.8rem}.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;max-width:1100px;margin:auto}.card{border:1px solid var(--black);background:#fff}.photo{height:420px;background:#fff;border-bottom:1px solid var(--black);display:flex;align-items:center;justify-content:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:contain}.details{padding:22px}.details h2{margin:0 0 8px}.details p{min-height:48px;margin:0 0 18px;color:var(--gray)}button{cursor:pointer}.open,.add{width:100%;padding:14px;border:1px solid var(--black);background:var(--black);color:#fff;text-transform:uppercase}.modal{position:fixed;inset:0;z-index:10;display:none;place-items:center;padding:20px;background:#0009}.modal.open{display:grid}.modal-box{position:relative;width:min(900px,100%);max-height:94vh;overflow:auto;background:#fff;padding:28px}.close{position:absolute;top:14px;right:18px;border:0;background:none;font-size:1.7rem}.modal-content{display:grid;grid-template-columns:1fr 1fr;gap:28px}.viewer{position:relative;height:420px;display:flex;align-items:center;justify-content:center}.viewer img{width:100%;height:100%;object-fit:contain}.arrow{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 5px #0003;font-size:1.4rem}.prev{left:12px}.next{right:12px}.colours{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.colour{padding:10px 14px;border:1px solid #bbb;background:#fff}.colour.selected{border:2px solid var(--black)}.size{width:100%;padding:12px;border:1px solid var(--light);margin:8px 0 18px}footer{padding:30px 6%;background:var(--black);color:#999;text-align:center;font-size:.8rem}@media(max-width:900px){.products{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){header{padding:17px 5%}.logo img{width:125px;height:36px}nav{gap:12px}nav a{font-size:.75rem}.products,.modal-content{grid-template-columns:1fr}.photo,.viewer{height:330px}}</style>
</head>
<body>
<header>
  <a class="logo" href="index.html" aria-label="Tiki Industries home"><img src="HLAG9608.JPG" alt="Tiki Industries logo"></a>
  <nav>
    <a href="shop.html">Shop</a>
    <a href="info.html">Info</a>
    <a href="basket.html" class="nav-basket">Basket <span class="basket-count" id="basket-count">0</span></a>
  </nav>
</header>
<div class="page"><div class="heading"><h1>Shop</h1></div><div class="products" id="products"></div></div>
<div class="modal" id="modal"><div class="modal-box"><button class="close" onclick="closeModal()">×</button><div class="modal-content"><div><div class="viewer"><img id="modal-image" src="" alt=""><button class="arrow prev" onclick="changeView(-1)">‹</button><button class="arrow next" onclick="changeView(1)">›</button></div></div><div><h2 id="modal-name"></h2><p id="modal-description"></p><p><strong>£20</strong></p><div><strong>Colour</strong></div><div class="colours" id="colours"></div><label><strong>Size</strong></label><select class="size" id="modal-size"><option value="">Choose a size</option><option>S</option><option>M</option><option>L</option><option>XL</option><option>XXL</option><option>XXXL</option></select><button class="add" onclick="addToBasket()">Add to basket</button></div></div></div></div>
<footer>© 2026 Tiki Industries. All rights reserved.</footer>
<script>
const products=[
  {name:'OG Hoodie',description:'The original Tiki Industries hoodie in OG colours.',colours:{White:{front:'babybluehoodiefront.JPG',back:'babybluehoodieback.JPG'},Brown:{front:'brownhoodiefront.JPG',back:'brownhoodieback.JPG'},Gray:{front:'grayhoodiefront.JPG',back:'grayhoodieback.JPG'},BabyBlue:{front:'whitehoodiefront.JPG',back:'whitehoodieback.JPG'},'Khaki Gray':{front:'khakigrayhoodiefront.JPG',back:'khakigrayhoodieback.JPG'},'Light Sunscreen':{front:'lightsunscreenhoodiefront.JPG',back:'lightsunscreenhoodieback.JPG'}}},
  {name:'The Nuclear Hoodie',description:'A black hoodie with the bold Nuclear graphic.',colours:{Black:{front:'image-2-black-hoodie-front.png.JPG',back:'image-4-black-hoodie-back.png.JPG'}}},
  {name:'OG T-Shirt',description:'The original Tiki Industries graphic T-shirt.',colours:{Blue:{front:'blueshirtfront.JPG',back:'blueshirtback.JPG'},Brown:{front:'brownshirtfront.JPG',back:'brownshirtback.JPG'},Gray:{front:'grayshirtfront.JPG',back:'grayshirtback.JPG'},Pink:{front:'pinkshirtfront.JPG',back:'pinkshirtback.JPG'},White:{front:'white%20shirt%20front.JPG',back:'WWEG2155.JPG'}}}
];
let currentProduct=0,currentColour='',currentView=0,basket=JSON.parse(localStorage.getItem('tikiBasket')||'[]');
document.getElementById('products').innerHTML=products.map((p,i)=>`<article class="card"><div class="photo"><img src="${Object.values(p.colours)[0].front}" alt="${p.name}"></div><div class="details"><h2>${p.name}</h2><p>${p.description}</p><button class="open" onclick="openModal(${i})">View product</button></div></article>`).join('');
function openModal(i){currentProduct=i;currentColour=Object.keys(products[i].colours)[0];currentView=0;document.getElementById('modal-name').textContent=products[i].name;document.getElementById('modal-description').textContent=products[i].description;document.getElementById('colours').innerHTML=Object.keys(products[i].colours).map(c=>`<button class="colour ${c===currentColour?'selected':''}" onclick="selectColour('${c}')">${c}</button>`).join('');document.getElementById('modal').classList.add('open');updateView();document.getElementById('modal-size').value=''}
function selectColour(c){currentColour=c;currentView=0;document.querySelectorAll('.colour').forEach(b=>b.classList.toggle('selected',b.textContent===c));updateView()}function changeView(d){currentView=(currentView+d+2)%2;updateView()}function updateView(){document.getElementById('modal-image').src=products[currentProduct].colours[currentColour][currentView?'back':'front']}function closeModal(){document.getElementById('modal').classList.remove('open')}function addToBasket(){const size=document.getElementById('modal-size').value;if(!size)return alert('Please choose a size first.');basket.push({name:currentColour+' '+products[currentProduct].name,size,price:20});localStorage.setItem('tikiBasket',JSON.stringify(basket));document.getElementById('basket-count').textContent=basket.length;closeModal()}document.getElementById('basket-count').textContent=basket.length;
</script>
</body>
</html>
