<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop | Tiki Industries</title>
<style>
:root{--black:#111;--gray:#777;--light:#eee;--white:#fff}*{box-sizing:border-box;scroll-behavior:smooth}body{margin:0;font-family:Arial,sans-serif;color:var(--black);line-height:1.5;background:#fff}a{text-decoration:none;color:inherit}header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:20px 6%;background:#fffffff2;border-bottom:1px solid var(--light);backdrop-filter:blur(8px)}.logo{font-weight:bold;letter-spacing:2px;text-transform:uppercase}.logo span{display:inline-block;padding:6px 10px;border:1px solid var(--black);margin-right:10px;font-size:.72rem}nav{display:flex;gap:22px;align-items:center}nav a{font-size:.9rem}.nav-basket{display:inline-flex;align-items:center;gap:8px}.basket-count{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 6px;border-radius:50%;background:var(--black);color:#fff;font-size:.7rem}.page{padding:60px 6% 90px}.heading{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:35px}.heading h1{margin:0;font-size:2.8rem;letter-spacing:-1px}.heading p{max-width:500px;color:var(--gray)}.products{display:flex;gap:24px;overflow-x:auto;padding-bottom:16px;scroll-snap-type:x mandatory}.products::-webkit-scrollbar{height:8px}.products::-webkit-scrollbar-thumb{background:var(--black)}.card{flex:0 0 310px;border:1px solid var(--light);scroll-snap-align:start;background:#fff}.photo{height:330px;background:var(--light);display:flex;align-items:center;justify-content:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:contain;display:block}.details{padding:20px}.details h3{margin:0 0 8px;font-size:1rem}.details p{min-height:86px;margin:0 0 15px;color:var(--gray);font-size:.9rem}.size{width:100%;margin-bottom:15px;padding:10px;border:1px solid var(--light);background:#fff}.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px}.price{font-weight:bold}.add{padding:10px 13px;border:1px solid var(--black);background:var(--black);color:#fff;cursor:pointer}.add:hover{background:#fff;color:var(--black)}footer{padding:30px 6%;background:var(--black);color:#999;text-align:center;font-size:.8rem}@media(max-width:700px){header{padding:17px 5%}nav{gap:12px}nav a{font-size:.75rem}.heading{display:block}.heading p{margin-top:12px}.card{flex-basis:285px}}
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html"><span>T</span>Tiki Industries</a>
  <nav>
    <a href="shop.html">Shop</a>
    <a href="index.html#info">Info</a>
    <a href="basket.html" class="nav-basket">Basket <span class="basket-count" id="basket-count">0</span></a>
  </nav>
</header>

<div class="page">
  <div class="heading">
    <h1>Shop</h1>
    <p>All products are $20 and available in sizes S, M, L, XL, XXL, and XXXL. Scroll sideways to see everything.</p>
  </div>

  <div class="products" id="products"></div>
</div>

<footer>© 2026 Tiki Industries. All rights reserved.</footer>

<script>
const products = [
  ['image-1-white-hoodie-back.png.JPG','White Graphic Hoodie','A clean white hoodie with a bold Tiki graphic across the back.'],
  ['image-2-black-hoodie-front.png.JPG','Black Logo Hoodie','A black pullover hoodie with the Tiki Industries logo on the chest.'],
  ['image-3-pink-shirt-back.png.JPG','Pink Back Graphic T-Shirt','A pink T-shirt with a large black graphic for a standout trail look.'],
  ['image-4-black-hoodie-back.png.JPG','Black Gold Back Hoodie','A black hoodie with a large gold-and-orange back graphic.'],
  ['image-5-pink-shirt-front.png.JPG','Pink Logo T-Shirt','A simple pink T-shirt with a small front Tiki logo.'],
  ['image-6-white-shirt-back.png.JPG','White Back Graphic T-Shirt','A white T-shirt with a bold black Tiki graphic across the back.'],
  ['image-7-white-hoodie-front.png.JPG','White Logo Hoodie','A white pullover hoodie with a small front logo and kangaroo pocket.']
];
const sizes=['S','M','L','XL','XXL','XXXL'];

document.getElementById('products').innerHTML = products.map((p,i) => `
  <article class="card">
    <div class="photo"><img src="${p[0]}" alt="${p[1]}"></div>
    <div class="details">
      <h3>${p[1]}</h3>
      <p>${p[2]} Made for riding and everyday wear.</p>
      <select class="size" id="size-${i}">
        <option value="">Choose a size</option>
        ${sizes.map(s => `<option>${s}</option>`).join('')}
      </select>
      <div class="bottom">
        <span class="price">$20</span>
        <button class="add" onclick="addProduct('${p[1]}', ${i})">Add to basket</button>
      </div>
    </div>
  </article>
`).join('');

let basket = JSON.parse(localStorage.getItem('tikiBasket') || '[]');

function saveBasket() {
  localStorage.setItem('tikiBasket', JSON.stringify(basket));
}

function updateBasketBadge() {
  const count = document.getElementById('basket-count');
  count.textContent = basket.length;
}

function addProduct(name, index) {
  const size = document.getElementById(`size-${index}`).value;
  if (!size) {
    alert('Please choose a size first.');
    return;
  }
  basket.push({ name, size, price: 20 });
  saveBasket();
  updateBasketBadge();
}

updateBasketBadge();
</script>
</body>
</html>
